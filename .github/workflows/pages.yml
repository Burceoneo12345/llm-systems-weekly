name: 搜索研究进展并发布看板
run-name: ${{ github.event_name == 'push' && '发布看板' || '检索论文与源码并发布' }}
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1,5'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      cutoff:
        description: '可选的历史截止时间，含时区。留空使用本次运行的创建时间。'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      report: ${{ steps.collect.outputs.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: 检查单一来源发布与停机补检
        run: python3 -m unittest discover -s tests
      - name: 检索论文、合并记录和版本发布
        id: collect
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_UNTIL: ${{ inputs.cutoff }}
        run: |
          if [[ -z "$REPORT_UNTIL" ]]; then
            REPORT_UNTIL=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          fi
          python3 scripts/digest.py collect "$RUNNER_TEMP/sources.json" --until "$REPORT_UNTIL"
      - name: 缓存中文摘要模型
        if: steps.collect.outputs.path != '' && steps.collect.outputs.count != '0'
        uses: actions/cache@v6
        with:
          path: ~/.cache/weekly-qwen3-8b
          key: weekly-qwen3-8b-q4km-d98cdcbd
      - name: 在 GitHub 托管 CPU 上撰写中文周报
        if: steps.collect.outputs.path != ''
        env:
          ITEM_COUNT: ${{ steps.collect.outputs.count }}
        run: |
          if [[ "$ITEM_COUNT" = "0" ]]; then
            python3 scripts/digest.py write "$RUNNER_TEMP/sources.json"
          else
            bash scripts/write-report.sh "$RUNNER_TEMP/sources.json"
          fi
      - run: npm run build
      - name: 将本期原文存入仓库
        if: steps.collect.outputs.path != ''
        env:
          REPORT: ${{ steps.collect.outputs.path }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$REPORT"
          git commit -m "发布大模型系统周报 $(basename "$REPORT" .md)"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if ! git diff --quiet HEAD^ origin/main -- reports/; then
              echo "检索期间归档发生变动，需要基于新检索区间重跑。"
              exit 1
            fi
            git rebase origin/main
            npm ci
            npm run build
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: 检查已发布的页面
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          REPORT: ${{ needs.build.outputs.report }}
        run: |
          url="${SITE%/}/"
          if [[ -n "$REPORT" ]]; then
            url="${url}weeks/$(basename "$REPORT" .md)/"
          fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 "$url" -o "$RUNNER_TEMP/published.html"
          grep -Fq '大模型系统周报' "$RUNNER_TEMP/published.html"
          printf '已发布 [大模型系统周报](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
