name: 校验并发布周报看板
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      edition: ${{ steps.build.outputs.edition }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: python3 -m unittest discover -s tests
      - name: 构建已归档的周报和封面
        id: build
        run: |
          npm run build
          latest=$(git ls-files 'reports/????-??-??.md' | tail -n 1)
          echo "edition=$(basename "$latest" .md)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: 核对首页、当期固定链接与封面
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          EDITION: ${{ needs.build.outputs.edition }}
        run: |
          url="${SITE%/}/"
          html="$RUNNER_TEMP/published.html"
          for page in "" "weeks/$EDITION/"; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 "${url}${page}?deployment=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$html"
            grep -Fq "<time datetime=\"$EDITION\">" "$html"
            if grep -Fq 'class="cover-art"' "$html"; then
              cover=$(grep -oE "assets/covers/$EDITION-[a-f0-9]{12}\.webp\?v=[a-f0-9]{10}" "$html")
              curl -fsSL --retry 5 --retry-all-errors "$url$cover" -o "$RUNNER_TEMP/published.webp"
              test "$(sha256sum "$RUNNER_TEMP/published.webp" | cut -c1-10)" = "${cover##*=}"
            fi
          done
